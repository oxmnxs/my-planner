  --accent:#111111;--on-accent:#FFFFFF;--accent-soft:#EBEBED;--danger:#D92D3A;
  --font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F10;--surface:#1B1B1D;--ink:#F3F3F4;--muted:#A1A1A6;--line:#2E2E31;
    --accent:#F3F3F4;--on-accent:#0F0F10;--accent-soft:#2A2A2D;--danger:#FF6B76;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0F10;--surface:#1B1B1D;--ink:#F3F3F4;--muted:#A1A1A6;--line:#2E2E31;
  --accent:#F3F3F4;--on-accent:#0F0F10;--accent-soft:#2A2A2D;--danger:#FF6B76;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);padding-bottom:76px;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-height:42px}
textarea{resize:vertical;line-height:1.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{margin:0}
.page{max-width:720px;margin:0 auto;padding:14px 14px 20px}

/* 공통 */
.nav{display:flex;align-items:center;gap:6px}
.nl{flex:1;text-align:center;min-width:0}
.nt{font-size:22px;font-weight:700;letter-spacing:-.02em}
.ns{font-size:13px;color:var(--muted)}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;cursor:pointer;flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;min-height:42px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:26px 10px}

/* 하단 탭 */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;border:0;background:none;padding:8px 0 7px;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:56px}
#tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

/* 주간 */
.wk{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:10px}
.wkin{min-width:500px;display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr))}
.dh{padding:6px 0 5px;text-align:center;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);cursor:pointer}
.dh b{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-top:1px}
.dh.today b{color:var(--on-accent);background:var(--accent);border-radius:999px;width:26px;height:26px;line-height:26px;margin:1px auto 0}
.tc,.dc{position:relative;height:792px}
.tc span{position:absolute;right:4px;font-size:10px;color:var(--muted)}
.dc{border-left:1px solid var(--line);cursor:pointer;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--line) 43px,var(--line) 44px)}
.ev{position:absolute;border-radius:6px;padding:2px 4px;font-size:11px;line-height:1.25;overflow:hidden;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--ink);cursor:pointer;word-break:break-all}
.ev small{display:block;color:var(--muted);font-size:10px}
.ev.done{opacity:.55;text-decoration:line-through}
.now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:2;pointer-events:none}

/* 일간 */
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.row{display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;overflow:hidden}
.chk{width:52px;flex:none;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.chk::before{content:"";width:24px;height:24px;border-radius:8px;border:2px solid var(--muted)}
.chk.on::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
.rb{flex:1;padding:10px 12px 10px 0;cursor:pointer;min-width:0}
.rt{font-size:13px;color:var(--muted)}
.rn{font-weight:600;font-size:16px;word-break:break-all}
.row.done .rn{text-decoration:line-through;color:var(--muted)}

/* 기록 */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 14px}
.moods button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 6px;cursor:pointer;font-size:26px;line-height:1.1}
.moods button small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.moods button.on{border-color:var(--accent);background:var(--accent-soft)}
.fl{display:block;margin:0 0 12px;font-size:13.5px;color:var(--muted);font-weight:500}
.fl>input,.fl>textarea,.fl>select{margin-top:5px;color:var(--ink)}
.past{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.past .pe{font-size:22px}
.past .pd{font-size:12.5px;color:var(--muted)}
.past .px{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.past>div{min-width:0}
.h2{font-size:16px;font-weight:700;margin:20px 0 8px}

/* 할 일 / 끌기 선택 */
.dc,.ev{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sel{position:absolute;left:2px;right:2px;border-radius:6px;background:color-mix(in srgb,var(--accent) 30%,transparent);border:2px solid var(--accent);z-index:3;pointer-events:none;font-size:11px;padding:2px 4px;color:var(--ink);font-weight:700;overflow:hidden}
.bh{display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px}
.bh b{font-size:16px}
.bh small{color:var(--muted);font-weight:400;margin-left:6px;font-size:12.5px}
.bempty{color:var(--muted);font-size:13.5px;padding:2px 2px 0}
.bds{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.bd{font-size:11.5px;padding:0 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);line-height:20px}
.bd.imp{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.bd.urg{color:var(--danger);border-color:var(--danger)}
.bd.top{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.tgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tg{position:relative;cursor:pointer}
.tg input{position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;margin:0;min-height:0;cursor:pointer}
.tg span{display:inline-block;padding:9px 14px;border:1px solid var(--line);border-radius:99px;color:var(--ink);font-size:14.5px;background:var(--surface)}
.tg input:checked+span{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.tg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.hintq{margin-top:8px;font-size:13.5px;color:var(--accent);min-height:20px}

/* 월간 */
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin-top:10px}
.mh{padding:7px 0;text-align:center;font-size:12.5px;color:var(--muted)}
.mh.sun,.dh.sun{color:var(--danger)}
.mc{min-height:92px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px 3px 3px;cursor:pointer;min-width:0;overflow:hidden}
.mc:nth-child(7n+1){border-left:0}
.mc.out{opacity:.4}
.mc .dn{display:inline-block;font-size:12.5px;font-weight:600;margin-bottom:2px;min-width:22px;text-align:center;line-height:22px}
.mc.sun .dn{color:var(--danger)}
.mc.today .dn{background:var(--accent);color:var(--on-accent);border-radius:99px}
.mp{display:block;font-size:10.5px;line-height:1.35;padding:1px 3px;border-radius:4px;margin-top:2px;background:color-mix(in srgb,var(--c) 22%,var(--surface));border-left:2px solid var(--c);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mp.done{opacity:.5;text-decoration:line-through}
.more{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;padding-left:3px}

/* 마인드맵 */
.mmwrap{overflow:auto;-webkit-overflow-scrolling:touch;height:52vh;min-height:300px;border:1px solid var(--line);border-radius:12px;background-color:var(--surface);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px}
.mm{display:block}
.nd{cursor:pointer}
.nd rect{fill:color-mix(in srgb,var(--c) 18%,var(--surface));stroke:var(--c);stroke-width:1.5}
.nd.root rect{fill:var(--accent);stroke:none}
.nd.root text{fill:var(--on-accent);font-size:16px;font-weight:700}
.nd text{fill:var(--ink);font-size:14px;font-weight:500;pointer-events:none;user-select:none;-webkit-user-select:none}
.nd.sel rect{stroke-width:3.5;stroke:var(--ink)}
.edge{fill:none;stroke-width:2.2;opacity:.8}
.mmtb{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.mmtb .hint{color:var(--muted);font-size:13.5px}
.mmtop{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.mmtop select{flex:1;min-width:0}

/* 비전 */
.vs{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.vs textarea{border:0;padding:0;background:none;font-size:19px;font-weight:600;line-height:1.5;min-height:84px;letter-spacing:-.01em}
.vs .fl{margin-bottom:4px}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.goal{background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:150px}
.goal .ge{font-size:30px;line-height:1.2}
.goal .gt{font-weight:700;font-size:16px;line-height:1.3;word-break:break-all}
.goal .gm{font-size:13px;color:var(--muted);word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.goal .gd{font-size:12.5px;font-weight:600;color:var(--c)}
.goal .gs{margin-top:auto;padding-top:8px}
.goal .pg{height:7px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,var(--surface));overflow:hidden}
.goal .pg i{display:block;height:100%;background:var(--c)}
.goal .gp{font-size:12px;color:var(--muted);margin-top:3px}

/* 모달 */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,12,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-h h2{font-size:18px}
.x{border:0;background:none;font-size:20px;width:40px;height:40px;cursor:pointer;color:var(--muted)}
.sh-f{display:flex;gap:8px;margin-top:6px}
.sh-f .pri{flex:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.swb{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);background:var(--c);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.swb.on{box-shadow:0 0 0 3px var(--ink)}
.err{color:var(--danger);font-size:13.5px;min-height:20px;margin-bottom:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<main id="view"></main>
<nav id="tabs" aria-label="메뉴"></nav>
<div id="modalRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var COLORS=['#2563EB','#16A34A','#F59E0B','#DC2626','#7C3AED','#6B7280'];
var MIG={'#3347E0':'#2563EB','#0E9F8A':'#16A34A','#E08A00':'#F59E0B','#D6336C':'#DC2626','#7048E8':'#7C3AED','#5C7080':'#6B7280'};
var KEY='planner_v1';
var HS=6,HE=24,HH=44;
var DAYN=['일','월','화','수','목','금','토'];
var MOODS=[['😞','힘들어요'],['😕','별로예요'],['😐','보통이에요'],['🙂','좋아요'],['😄','최고예요']];

/* ---------- 저장 ---------- */
function blank(){return {events:[],todos:[],logs:{},maps:[],vision:{statement:'',goals:[]}}}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){var o=JSON.parse(r);var b=blank();for(var k in b){if(o[k]===undefined)o[k]=b[k]}
      (o.events||[]).forEach(function(e){if(MIG[e.color])e.color=MIG[e.color]});
      ((o.vision&&o.vision.goals)||[]).forEach(function(g){if(MIG[g.color])g.color=MIG[g.color]});
      return o}
  }catch(e){}
  return blank();
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var saveT=null;
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,400)}
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',function(){if(document.hidden)save()});

/* ---------- 유틸 ---------- */
function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function weekStartOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}
function toMin(t){var p=t.split(':').map(Number);return p[0]*60+p[1]}
function fromMin(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function byStart(a,b){return toMin(a.start)-toMin(b.start)||toMin(a.end)-toMin(b.end)}
function dayLabel(d){return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+DAYN[d.getDay()]+'요일'}
var toastT=null;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2000)}

/* ---------- 화면 상태 ---------- */
var today0=new Date();
var ui={tab:'week',weekStart:weekStartOf(today0),day:fmt(today0),logDay:fmt(today0),mapId:null,sel:null,month:new Date(today0.getFullYear(),today0.getMonth(),1)};
var curColor=COLORS[0];
var suppressUntil=0;
var curTodo=null;

var ICONS={
  month:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M9 9v12M15 9v12M3 15h18"/>',
  week:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  day:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
  log:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',
  map:'<circle cx="12" cy="12" r="2.5"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="20" r="2"/><path d="M10 11L6.5 7.5M14 11l3.5-3.5M12 14.5V18"/>',
  vision:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'
};
var TABS=[['month','월간'],['week','주간'],['day','일간'],['log','기록'],['map','마인드맵'],['vision','비전']];
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(function(t){
    return '<button data-act="tab" data-t="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[t[0]]+'</svg>'+t[1]+'</button>';
  }).join('');
}
function render(){
  renderTabs();
  var v=$('#view');
  ({month:rMonth,week:rWeek,day:rDay,log:rLog,map:rMap,vision:rVision})[ui.tab](v);
}
function navRow(k,label,sub){
  return '<div class="nav"><button class="ib" data-act="shift" data-k="'+k+'" data-n="-1" aria-label="이전">‹</button>'+
  '<div class="nl"><div class="nt">'+label+'</div>'+(sub?'<div class="ns">'+sub+'</div>':'')+'</div>'+
  '<button class="ib" data-act="shift" data-k="'+k+'" data-n="1" aria-label="다음">›</button></div>';
}

/* ---------- 모달 ---------- */
function closeModal(){$('#modalRoot').innerHTML=''}
function openModal(o){
  var root=$('#modalRoot');
  root.innerHTML='<div class="ov" data-act="closeModal"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(o.title)+'">'+
    '<div class="sh-h"><h2>'+esc(o.title)+'</h2><button class="x" data-act="closeModal" aria-label="닫기">✕</button></div>'+
    '<div>'+o.body+'</div><div class="err" id="mErr"></div>'+
    '<div class="sh-f">'+(o.onDelete?'<button class="btn danger" id="mDel">삭제</button>':'')+'<button class="btn pri" id="mSave">저장</button></div></div></div>';
  $('#mSave').onclick=function(){var r=o.onSave();if(r){$('#mErr').textContent=r}else{closeModal()}};
  root.querySelector('.sheet').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.matches&&e.target.matches('input[type=text]')){e.preventDefault();$('#mSave').click()}});
  if(o.onDelete){
    var b=$('#mDel'),armed=false;
    b.onclick=function(){
      if(!armed){armed=true;b.textContent='한 번 더 누르면 삭제';setTimeout(function(){if(b.isConnected){armed=false;b.textContent='삭제'}},3000);return}
      o.onDelete();closeModal();
    };
  }
  var f=root.querySelector('input[type=text],textarea');if(f&&!o.noFocus)f.focus();
  return root;
}
function swatches(cur){
  curColor=cur;
  return '<div class="fl">색<div class="sw" id="fColors">'+COLORS.map(function(c){
    return '<button type="button" class="swb'+(c===cur?' on':'')+'" data-act="pickColor" data-c="'+c+'" style="--c:'+c+'" aria-label="색 선택"></button>';
  }).join('')+'</div></div>';
}

/* ---------- 일정 ---------- */
function eventModal(ev,def){
  var isNew=!ev;
  var e=ev||{id:uid(),title:'',date:def.date,start:def.start,end:def.end,color:COLORS[0],done:false};
  openModal({
    title:isNew?'일정 추가':'일정 수정',

function findEv(id){return S.events.filter(function(e){return e.id===id})[0]}

function layout(list){
  var s=list.slice().sort(byStart),groups=[],cur=[],curEnd=-1,lane=new Map(),res=[];
  s.forEach(function(e){
    var st=toMin(e.start);
    if(cur.length&&st>=curEnd){groups.push(cur);cur=[];curEnd=-1}
    cur.push(e);curEnd=Math.max(curEnd,toMin(e.end));
  });
  if(cur.length)groups.push(cur);
  groups.forEach(function(g){
    var lanes=[];
    g.forEach(function(e){
      var i=-1;for(var j=0;j<lanes.length;j++){if(lanes[j]<=toMin(e.start)){i=j;break}}
      if(i<0){i=lanes.length;lanes.push(0)}
      lanes[i]=toMin(e.end);lane.set(e.id,i);
    });
    g.forEach(function(e){res.push({e:e,l:lane.get(e.id),n:lanes.length})});
  });
  return res;
}

function blockOfTime(t){var h=Math.floor(toMin(t)/60);return h>=6&&h<12?'morning':h>=12&&h<18?'afternoon':h>=18&&h<22?'evening':'night'}
function blockName(k){for(var i=0;i<BLOCKS.length;i++)if(BLOCKS[i][0]===k)return BLOCKS[i][1];return ''}

  mmDraw();mmToolbar();mmReveal();

function mmById(m){var b=new Map();m.nodes.forEach(function(n){b.set(n.id,n)});return b}
function mmDesc(m,id){
  var out=[],stack=[id];
  while(stack.length){var c=stack.pop();out.push(c);m.nodes.forEach(function(n){if(n.p===c)stack.push(n.id)})}
  return out;
}
function tw(t){var w=0;for(var i=0;i<t.length;i++)w+=t.charCodeAt(i)<128?8.6:15;return w}
function mmLayout(m){
  var PAD=24,ROW=50,GAP=60,kids=new Map();
  m.nodes.forEach(function(n){if(n.p!==null){if(!kids.has(n.p))kids.set(n.p,[]);kids.get(n.p).push(n)}});
  var root=m.nodes.filter(function(n){return n.p===null})[0];
  var info=new Map(),maxW=[],leaf=0;
  function walk(n,d){
    var isRoot=n.p===null,w=isRoot?tw(n.t)*1.15+38:tw(n.t)+28;
    maxW[d]=Math.max(maxW[d]||0,w);
    var ks=kids.get(n.id)||[],y;
    if(!ks.length){y=leaf*ROW;leaf++}
    else{var ys=ks.map(function(k){return walk(k,d+1)});y=(ys[0]+ys[ys.length-1])/2}
    info.set(n.id,{d:d,y:y,w:w,h:isRoot?42:34});
    return y;
  }
  walk(root,0);
  var xs=[],x=PAD;
  maxW.forEach(function(mw,d){xs[d]=x+mw/2;x+=mw+GAP});
  info.forEach(function(o){o.cx=xs[o.d];o.cy=PAD+17+o.y});
  return {info:info,W:x-GAP+PAD,H:PAD*2+34+Math.max(leaf-1,0)*ROW};
}
function mmDraw(){
  var svg=$('#mm'),m=curMap();if(!svg||!m)return;
  var L=mmLayout(m),b=mmById(m);
  svg.setAttribute('width',L.W);svg.setAttribute('height',L.H);
  function colOf(n){
    if(n.p===null)return null;
    var c=n;while(b.get(c.p).p!==null)c=b.get(c.p);
    var sib=m.nodes.filter(function(x){return x.p===c.p});
    for(var i=0;i<sib.length;i++)if(sib[i].id===c.id)return COLORS[i%COLORS.length];
    return COLORS[0];
  }
  var edges='',nodes='';
  m.nodes.forEach(function(n){
    if(n.p===null)return;
    var a=L.info.get(n.p),c=L.info.get(n.id);
    var x1=a.cx+a.w/2,x2=c.cx-c.w/2,mx=(x1+x2)/2;
    edges+='<path class="edge" style="stroke:'+colOf(n)+'" d="M'+x1+' '+a.cy+' C'+mx+' '+a.cy+' '+mx+' '+c.cy+' '+x2+' '+c.cy+'"/>';
  });
  m.nodes.forEach(function(n){
    var o=L.info.get(n.id),root=n.p===null;
    nodes+='<g class="nd'+(root?' root':'')+(ui.sel===n.id?' sel':'')+'" data-act="selNode" data-id="'+n.id+'" style="--c:'+(root?'var(--accent)':colOf(n))+'" transform="translate('+o.cx+','+o.cy+')">'+
      '<rect x="'+(-o.w/2)+'" y="'+(-o.h/2)+'" width="'+o.w+'" height="'+o.h+'" rx="'+(o.h/2)+'"/><text text-anchor="middle" dy=".35em">'+esc(n.t)+'</text></g>';
  });
  $('#mmg').innerHTML=edges+nodes;
}
function mmReveal(){
  var w=$('#mmwrap'),m=curMap();if(!w||!m||!ui.sel)return;
  var o=mmLayout(m).info.get(ui.sel);if(!o)return;
  w.scrollLeft=Math.max(0,o.cx-w.clientWidth/2);
  w.scrollTop=Math.max(0,o.cy-w.clientHeight/2);
}
function mmToolbar(){
  var tb=$('#mmtb'),m=curMap();if(!tb||!m)return;
  var n=m.nodes.filter(function(x){return x.id===ui.sel})[0];
  if(!n){tb.innerHTML='<span class="hint">마디를 눌러 고른 뒤, 아래 버튼으로 가지를 늘려요. 위치는 자동으로 정리돼요.</span>';return}
  tb.innerHTML='<button class="btn pri" data-act="mAdd">하위 추가</button>'+
    (n.p!==null?'<button class="btn" data-act="mAddSib">같은 단계 추가</button>':'')+
    '<button class="btn" data-act="mRename">이름 수정</button>'+
    '<button class="btn danger" data-act="delNode" data-label="'+(n.p===null?'맵 삭제':'삭제')+'">'+(n.p===null?'맵 삭제':'삭제')+'</button>';
}
function mmTextModal(title,init,cb){
  openModal({title:title,body:'<label class="fl">내용<input id="fText" type="text" maxlength="24" value="'+esc(init)+'"></label>',onSave:function(){
    var t=$('#fText').value.trim();if(!t)return '내용을 입력해 주세요.';cb(t);
  }});
}

/* ---------- 비전 ---------- */
function dday(due){
  var n=Math.round((parse(due)-parse(fmt(new Date())))/86400000);
  return n===0?'D-day':n>0?'D-'+n:'D+'+(-n);
}
function rVision(v){
  var V=S.vision;
  var h='<div class="page"><div class="nt">비전 보드</div>'+
    '<div class="vs"><label class="fl">내가 되고 싶은 모습<textarea data-vs="1" placeholder="예: 1년 뒤의 나는 ...">'+esc(V.statement)+'</textarea></label></div>'+
    '<div class="bar"><button class="btn pri" data-act="addGoal">＋ 목표 추가</button></div>';
  if(V.goals.length){
    h+='<div class="goals">'+V.goals.map(function(g){
      return '<div class="goal" role="button" tabindex="0" data-act="editGoal" data-id="'+g.id+'" style="--c:'+g.color+'"><div class="ge">'+esc(g.emoji||'🎯')+'</div><div class="gt">'+esc(g.title)+'</div>'+
        (g.memo?'<div class="gm">'+esc(g.memo)+'</div>':'')+(g.due?'<div class="gd">'+dday(g.due)+'</div>':'')+
        '<div class="gs"><div class="pg"><i style="width:'+g.progress+'%"></i></div><div class="gp">'+g.progress+'%</div></div></div>';
    }).join('')+'</div>';
  }else{
    h+='<div class="empty">이루고 싶은 목표를 카드로 모아 보세요.</div>';
  }
  h+='</div>';
  v.innerHTML=h;
}
function goalModal(g0){
  var isNew=!g0;
  var g=g0||{id:uid(),emoji:'🎯',title:'',memo:'',due:'',progress:0,color:COLORS[0]};
  var root=openModal({
    title:isNew?'목표 추가':'목표 수정',
    body:'<div class="row2" style="grid-template-columns:84px 1fr"><label class="fl">이모지<input id="gE" type="text" value="'+esc(g.emoji)+'" style="text-align:center;font-size:22px"></label>'+
      '<label class="fl">목표<input id="gT" type="text" maxlength="40" placeholder="예: 수학 1등급" value="'+esc(g.title)+'"></label></div>'+
      '<label class="fl">이유나 메모<textarea id="gM" rows="3">'+esc(g.memo)+'</textarea></label>'+
      '<label class="fl">기한<input id="gD" type="date" value="'+g.due+'"></label>'+
      '<label class="fl">진행률 <b id="gPv" style="color:var(--ink)">'+g.progress+'%</b><input id="gP" type="range" min="0" max="100" step="5" value="'+g.progress+'" style="padding:0"></label>'+
      swatches(g.color),
    noFocus:!isNew,
    onSave:function(){
      var t=$('#gT').value.trim();if(!t)return '목표를 입력해 주세요.';
      g.emoji=$('#gE').value.trim()||'🎯';g.title=t;g.memo=$('#gM').value.trim();g.due=$('#gD').value;g.progress=+$('#gP').value;g.color=curColor;
      if(isNew)S.vision.goals.push(g);
      save();render();toast('저장했어요');
    },
    onDelete:isNew?null:function(){
      S.vision.goals=S.vision.goals.filter(function(x){return x.id!==g.id});save();render();toast('삭제했어요');
    }
  });
  $('#gP').oninput=function(){$('#gPv').textContent=this.value+'%'};
}

/* ---------- 동작 ---------- */
var ACT={
  tab:function(el){ui.tab=el.dataset.t;render();window.scrollTo(0,0)},
  shift:function(el){
    var k=el.dataset.k,n=+el.dataset.n;
    if(k==='week')ui.weekStart=addDays(ui.weekStart,7*n);
    else if(k==='month')ui.month=new Date(ui.month.getFullYear(),ui.month.getMonth()+n,1);
    else if(k==='day')ui.day=fmt(addDays(parse(ui.day),n));
    else ui.logDay=fmt(addDays(parse(ui.logDay),n));
    render();
  },
  todayGo:function(el){
    var k=el.dataset.k,t=new Date();
    if(k==='week')ui.weekStart=weekStartOf(t);else if(k==='month')ui.month=new Date(t.getFullYear(),t.getMonth(),1);else if(k==='day')ui.day=fmt(t);else ui.logDay=fmt(t);
    render();
  },
  openDay:function(el){ui.day=el.dataset.date;ui.tab='day';render();window.scrollTo(0,0)},
  addEv:function(){
    var date=ui.day;
    if(ui.tab==='month'){var tt=fmt(new Date());date=tt.slice(0,7)===fmt(ui.month).slice(0,7)?tt:fmt(ui.month)}
    else if(ui.tab==='week'){
      var t=fmt(new Date());date=(t>=fmt(ui.weekStart)&&t<=fmt(addDays(ui.weekStart,6)))?t:fmt(ui.weekStart);
    }
    eventModal(null,{date:date,start:'09:00',end:'10:00'});
  },
  addAt:function(el,e){
    if(Date.now()<suppressUntil)return;
    var r=el.getBoundingClientRect(),y=e.clientY-r.top;
    var m=HS*60+Math.floor(y/HH*2)*30;m=Math.max(HS*60,Math.min(m,22*60));
    eventModal(null,{date:el.dataset.date,start:fromMin(m),end:fromMin(Math.min(m+60,23*60+59))});
  },
  editEv:function(el){var e=findEv(el.dataset.id);if(e)eventModal(e)},
  toggle:function(el){var e=findEv(el.dataset.id);if(e){e.done=!e.done;save();render()}},
  addTodo:function(){todoModal(null)},
  addTodoIn:function(el){todoModal(null,{block:el.dataset.b})},
  editTodo:function(el){var t=S.todos.filter(function(x){return x.id===el.dataset.id})[0];if(t)todoModal(t)},
  todoToggle:function(el){var t=S.todos.filter(function(x){return x.id===el.dataset.id})[0];if(t){t.done=!t.done;save();render()}},
  todoTomorrow:function(){
    if(!curTodo)return;
    curTodo.date=fmt(addDays(parse(curTodo.date),1));save();closeModal();render();toast('내일로 옮겼어요');
  },
  copyLast:function(){
    var prev=addDays(ui.weekStart,-7),a=fmt(prev),b=fmt(addDays(prev,6));
    var src=S.events.filter(function(e){return e.date>=a&&e.date<=b});
    if(!src.length){toast('지난주에 일정이 없어요');return}
    var n=0;
    src.forEach(function(e){
      var nd=fmt(addDays(parse(e.date),7));
      var dup=S.events.some(function(x){return x.date===nd&&x.start===e.start&&x.end===e.end&&x.title===e.title});
      if(dup)return;
      S.events.push({id:uid(),title:e.title,date:nd,start:e.start,end:e.end,color:e.color,done:false});n++;
    });
    save();render();toast(n?n+'개 일정을 가져왔어요':'이미 모두 복사되어 있어요');
  },
  gotoLog:function(){ui.logDay=ui.day;ui.tab='log';render();window.scrollTo(0,0)},
  closeModal:function(el,e){if(el.classList.contains('ov')&&e.target!==el)return;closeModal()},
  pickColor:function(el){
    curColor=el.dataset.c;
    document.querySelectorAll('#fColors .swb').forEach(function(b){b.classList.toggle('on',b===el)});
  },
  mood:function(el){var l=getLog(),v=+el.dataset.v;l.mood=l.mood===v?0:v;save();render()},
  openLog:function(el){ui.logDay=el.dataset.date;render();window.scrollTo(0,0)},
  newMap:function(){
    mmTextModal('새 마인드맵','',function(t){
      var m={id:uid(),name:t,nodes:[{id:uid(),p:null,t:t}]};
      S.maps.push(m);ui.mapId=m.id;ui.sel=m.nodes[0].id;save();render();
    });
  },
  selNode:function(el){ui.sel=el.dataset.id;mmDraw();mmToolbar()},
  deselNode:function(){if(ui.sel){ui.sel=null;mmDraw();mmToolbar()}},
  mAdd:function(){
    var m=curMap(),p=m.nodes.filter(function(n){return n.id===ui.sel})[0];if(!p)return;
    mmTextModal('하위 항목 추가','',function(t){
      var n={id:uid(),p:p.id,t:t};
      m.nodes.push(n);ui.sel=n.id;save();mmDraw();mmToolbar();mmReveal();
    });
  },
  mAddSib:function(){
    var m=curMap(),s=m.nodes.filter(function(n){return n.id===ui.sel})[0];if(!s||s.p===null)return;
    mmTextModal('같은 단계 추가','',function(t){
      var n={id:uid(),p:s.p,t:t};
      m.nodes.push(n);ui.sel=n.id;save();mmDraw();mmToolbar();mmReveal();
    });
  },
  mRename:function(){
    var m=curMap(),n=m.nodes.filter(function(x){return x.id===ui.sel})[0];if(!n)return;
    mmTextModal('이름 수정',n.t,function(t){n.t=t;if(n.p===null)m.name=t;save();render()});
  },
  delNode:function(el){
    if(!el.dataset.armed){
      el.dataset.armed='1';el.textContent='한 번 더 누르면 삭제';
      setTimeout(function(){if(el.isConnected){delete el.dataset.armed;el.textContent=el.dataset.label}},3000);
      return;
    }
    var m=curMap(),n=m.nodes.filter(function(x){return x.id===ui.sel})[0];if(!n)return;
    if(n.p===null){S.maps=S.maps.filter(function(x){return x.id!==m.id});ui.mapId=null;ui.sel=null;save();render();toast('삭제했어요');return}
    var gone=mmDesc(m,n.id);
    m.nodes=m.nodes.filter(function(x){return gone.indexOf(x.id)<0});
    ui.sel=n.p;save();mmDraw();mmToolbar();toast('삭제했어요');
  },
  addGoal:function(){goalModal(null)},
  editGoal:function(el){
    var g=S.vision.goals.filter(function(x){return x.id===el.dataset.id})[0];if(g)goalModal(g);
  }
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var h=ACT[el.dataset.act];if(h)h(el,e);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.log){getLog()[t.dataset.log]=t.value;saveSoon()}
  else if(t.dataset&&t.dataset.vs==='1'){S.vision.statement=t.value;saveSoon()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.sel==='map'){ui.mapId=t.value;ui.sel=null;render()}
});

/* ---------- 주간표: 길게 누르고 끌어서 시간 선택 ---------- */
var drag=null;
function slotOf(col,clientY){
  var y=clientY-col.getBoundingClientRect().top,s=Math.floor(y/(HH/2)),max=(HE-HS)*2-1;
  return Math.max(0,Math.min(max,s));
}
function dragRange(){
  var a=Math.min(drag.s0,drag.s1),b=Math.max(drag.s0,drag.s1);
  return {st:HS*60+a*30,en:Math.min(HS*60+(b+1)*30,23*60+59)};
}
function dragPaint(){
  var r=dragRange();
  if(!drag.box){drag.box=document.createElement('div');drag.box.className='sel';drag.col.appendChild(drag.box)}
  drag.box.style.top=((r.st-HS*60)/60*HH)+'px';
  drag.box.style.height=((r.en-r.st)/60*HH)+'px';
  drag.box.textContent=fromMin(r.st)+' – '+fromMin(r.en);
}
function dragStop(){
  if(!drag)return;
  clearTimeout(drag.timer);
  if(drag.box&&drag.box.parentNode)drag.box.parentNode.removeChild(drag.box);
  drag=null;
}
function dragActivate(){
  if(!drag||drag.active)return;
  drag.active=true;dragPaint();
  try{if(navigator.vibrate)navigator.vibrate(15)}catch(x){}
}
document.addEventListener('pointerdown',function(e){
  var col=e.target.closest&&e.target.closest('.dc');
  if(!col||e.target.closest('.ev'))return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  dragStop();
  var s=slotOf(col,e.clientY);
  drag={col:col,date:col.dataset.date,s0:s,s1:s,x:e.clientX,y:e.clientY,active:false,mouse:e.pointerType==='mouse',timer:null,box:null};
  if(!drag.mouse)drag.timer=setTimeout(dragActivate,350);
});
document.addEventListener('pointermove',function(e){
  if(!drag)return;
  var dist=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);
  if(!drag.active){
    if(drag.mouse){if(dist>5)dragActivate();else return}
    else{if(dist>10)dragStop();return}
  }
  drag.s1=slotOf(drag.col,e.clientY);dragPaint();
});
document.addEventListener('pointerup',function(){
  if(!drag)return;
  var was=drag.active,r=was?dragRange():null,date=drag.date;
  dragStop();
  if(was){
    suppressUntil=Date.now()+700;
    eventModal(null,{date:date,start:fromMin(r.st),end:fromMin(r.en)});
  }
});
document.addEventListener('pointercancel',dragStop);
document.addEventListener('touchmove',function(e){if(drag&&drag.active)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',function(e){if(drag&&drag.active)e.preventDefault()});

render();
})();
</script>
